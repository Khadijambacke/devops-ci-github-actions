name: CI workflows

env:
  IMAGE_NAME: testcicd
  IMAGE_TAG: 1.1.0
  DOCKER_HUB_REGISTRY: docker.io/khadijamba

on:
  push:

jobs:
  docker:
    runs-on: isi-suptech

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Test Variables
        shell: pwsh
        run: |
          Write-Host "Variable IMAGE_NAME $env:IMAGE_NAME"
          Write-Host "Variable IMAGE_TAG $env:IMAGE_TAG"
          Write-Host "Variable DOCKER_HUB_REGISTRY $env:DOCKER_HUB_REGISTRY"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        shell: pwsh
        run: |
          docker build -t $env:DOCKER_HUB_REGISTRY/$env:IMAGE_NAME:$env:IMAGE_TAG .

      - name: List Docker image
        shell: pwsh
        run: |
          docker image ls $env:DOCKER_HUB_REGISTRY/$env:IMAGE_NAME:$env:IMAGE_TAG

      - name: Run Docker container for test
        shell: pwsh
        run: |
          docker run --rm $env:DOCKER_HUB_REGISTRY/$env:IMAGE_NAME:$env:IMAGE_TAG

      - name: Push Docker image
        shell: pwsh
        run: |
          docker push $env:DOCKER_HUB_REGISTRY/$env:IMAGE_NAME:$env:IMAGE_TAG
