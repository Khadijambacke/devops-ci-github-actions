name: CI workflows
on:
    push:
jobs:
    docker:
        runs-on: ubuntu-latest
        
        env:
            IMAGE_NAME: testcicd
            IMAGE_TAG: 1.0.0
            DOCKER_HUB_REGISTRY: docker.io/khadijamba
        steps:
            - name: Récuperer le code
              uses: actions/checkout@v4
            - name: Test Varibales
              run: echo "Varibale MONVAR  ${{ vars.MONVAR }} "
                echo "Varibale IMAGE_NAME $IMAGE_NAME"
                echo "Varibale DOCKER_HUB_REGISTRY  $DOCKER_HUB_REGISTRY "

            - name: Connexion à Docker Hub
              run: echo "${{ secrets.DOCKERHUB_TOKEN }} | docker login \
                   -u "${{ secrets.DOCKERHUB_USERNAME }} --password-stdin
                
            - name: Build de l'image Docker
              run:  docker build -t $DOCKER_HUB_REGISTRY/$IMAGE_NAME:$IMAGE_TAG .
            - name: Test de l'image Docker
              run:
                    docker image ls $DOCKER_HUB_REGISTRY/$IMAGE_NAME:$IMAGE_TAG 
  
            - name: Push image  docker
              run:  docker push $DOCKER_HUB_REGISTRY/$IMAGE_NAME:$IMAGE_TAG 
